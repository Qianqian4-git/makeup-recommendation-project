<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klea · 你的个人美妆智能</title>
    <style>
        /* 全局重置与品牌色 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: #f9f5f0;
            color: #2c2c2c;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
        }
        /* 头部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 24px;
        }
        .brand {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #1a1a1a;
        }
        .brand span { color: #d48c7c; }
        .user-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-area input {
            border: none;
            background: rgba(255,255,255,0.7);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.95rem;
            outline: none;
            width: 120px;
            transition: 0.2s;
        }
        .user-area input:focus { background: #fff; box-shadow: 0 0 0 2px #d48c7c; }
        .user-area .avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #d48c7c;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 1.2rem;
        }
        /* 主卡片 */
        .card {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 28px 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .card h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #4a4a4a;
            margin-bottom: 12px;
        }
        .card .sub {
            font-size: 0.9rem;
            color: #7a7a7a;
            margin-bottom: 16px;
        }
        /* 上传区域 */
        .upload-zone {
            border: 2px dashed #d4c4b8;
            border-radius: 28px;
            padding: 32px 20px;
            text-align: center;
            background: rgba(250, 245, 240, 0.5);
            cursor: pointer;
            transition: 0.25s;
        }
        .upload-zone:hover { border-color: #b09888; background: rgba(240, 235, 230, 0.6); }
        .upload-zone .icon { font-size: 2.8rem; }
        .upload-zone .main { font-weight: 500; color: #3d2a2a; margin-top: 4px; }
        .upload-zone .hint { font-size: 0.8rem; color: #8a7a7a; }
        #fileInput { display: none; }
        .preview-wrap { display: none; margin-top: 16px; justify-content: center; }
        .preview-wrap img { max-width: 100%; max-height: 180px; border-radius: 24px; }
        .preview-wrap.show { display: flex; }
        /* 按钮 */
        .btn-primary {
            width: 100%;
            padding: 14px 0;
            margin-top: 16px;
            background: #d48c7c;
            border: none;
            border-radius: 40px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary:hover:not(:disabled) { background: #c47a6a; transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading { display: none; align-items: center; justify-content: center; gap: 12px; margin: 16px 0; color: #6a5a5a; }
        .loading.show { display: flex; }
        .spinner { width: 22px; height: 22px; border: 3px solid #e0d0c8; border-top-color: #d48c7c; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* 结果展示 */
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0 12px;
        }
        .result-item {
            background: rgba(255,255,255,0.5);
            border-radius: 20px;
            padding: 14px 12px;
            text-align: center;
        }
        .result-item .label { font-size: 0.7rem; color: #8a7a7a; text-transform: uppercase; letter-spacing: 0.5px; }
        .result-item .value { font-size: 1.1rem; font-weight: 600; color: #2c2c2c; margin-top: 2px; }
        .result-item .value .highlight { color: #d48c7c; }
        .result .makeup-name { font-size: 1.4rem; font-weight: 600; margin: 8px 0 4px; }
        .result .reason { font-size: 0.9rem; color: #4a3a3a; line-height: 1.6; background: rgba(255,255,255,0.4); padding: 12px 16px; border-radius: 20px; border-left: 3px solid #d48c7c; }
        .result { display: none; margin-top: 20px; }
        .result.show { display: block; animation: fadeUp 0.4s ease; }
        @keyframes fadeUp { 0%{ opacity:0; transform: translateY(10px); } 100%{ opacity:1; transform: translateY(0); } }
        /* 聊天 tab 切换 */
        .tabs {
            display: flex;
            gap: 8px;
            margin: 16px 0 12px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 30px;
            background: transparent;
            font-weight: 500;
            color: #6a5a5a;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #d48c7c;
            color: #fff;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        /* 聊天界面 */
        .chat-box {
            height: 340px;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 20px;
            margin-bottom: 12px;
            min-height: 200px;
        }
        .chat-messages .msg {
            margin-bottom: 8px;
            padding: 8px 14px;
            border-radius: 20px;
            max-width: 85%;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .chat-messages .msg.user { background: #d48c7c; color: #fff; align-self: flex-end; margin-left: auto; border-bottom-right-radius: 4px; }
        .chat-messages .msg.assistant { background: #fff; color: #2c2c2c; border: 1px solid #e0d0c8; align-self: flex-start; border-bottom-left-radius: 4px; }
        .chat-input-row {
            display: flex;
            gap: 10px;
        }
        .chat-input-row input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 30px;
            border: 1px solid #dcc8c0;
            font-size: 0.9rem;
            outline: none;
            background: rgba(255,255,255,0.6);
        }
        .chat-input-row input:focus { border-color: #d48c7c; }
        .chat-input-row button {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            background: #d48c7c;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .chat-input-row button:hover { background: #c47a6a; }
        .error-box { display: none; margin-top: 12px; padding: 10px 14px; background: #fde8e8; border-radius: 16px; color: #b91c1c; font-size: 0.9rem; }
        .error-box.show { display: block; }
        .footer { font-size: 0.7rem; color: #b0a0a0; text-align: center; margin-top: 24px; }
    </style>
</head>
<body>
<div class="container">
    <!-- 头部 -->
    <div class="header">
        <div class="brand">Klea <span>·</span></div>
        <div class="user-area">
            <input type="text" id="usernameInput" placeholder="你的名字" value="林妍" />
            <div class="avatar" id="avatar">林</div>
        </div>
    </div>

    <!-- 主卡：妆容推荐 -->
    <div class="card">
        <h2>✨ 开始新的探索</h2>
        <div class="sub">上传一张自然光下的自拍，Klea 会为你分析脸型、肤色与最适合的妆容方向。</div>
        
        <div class="upload-zone" id="uploadZone">
            <div class="icon">📷</div>
            <div class="main">点击选择 或 拖拽图片</div>
            <div class="hint">支持 JPG / PNG / BMP / GIF</div>
        </div>
        <input type="file" id="fileInput" accept="image/*" />
        <div class="preview-wrap" id="previewWrap">
            <img id="previewImg" alt="预览" />
        </div>
        <button class="btn-primary" id="analyzeBtn" disabled>📸 分析我的照片</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <span>Klea 正在分析你的面部特征…</span>
        </div>
        <div class="error-box" id="errorBox"></div>

        <!-- 结果展示 -->
        <div class="result" id="result">
            <div class="makeup-name" id="makeupName"></div>
            <div class="result-grid">
                <div class="result-item"><div class="label">脸型</div><div class="value" id="faceShape">—</div></div>
                <div class="result-item"><div class="label">肤色基调</div><div class="value" id="skinTone">—</div></div>
                <div class="result-item"><div class="label">风格匹配度</div><div class="value" id="matchScore">—</div></div>
                <div class="result-item"><div class="label">推荐色号</div><div class="value" id="shade">—</div></div>
            </div>
            <div class="reason" id="reasonText"></div>
        </div>
    </div>

    <!-- 对话助手 -->
    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" data-tab="chat">💬 和 Klea 聊聊</button>
        </div>
        <div id="tab-chat" class="tab-content active">
            <div class="chat-box">
                <div class="chat-messages" id="chatMessages">
                    <div class="msg assistant">👋 你好！我是 Klea，你的专属美妆顾问。你可以问我关于妆容步骤、产品推荐，或者直接说“分析我的照片”。</div>
                </div>
                <div class="chat-input-row">
                    <input type="text" id="chatInput" placeholder="输入你的问题…" />
                    <button id="chatSend">发送</button>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">隐私安全 · 使用帮助 · 反馈建议</div>
</div>

<script>
    // ===== 用户昵称 =====
    const usernameInput = document.getElementById('usernameInput');
    const avatar = document.getElementById('avatar');
    usernameInput.addEventListener('input', () => {
        const name = usernameInput.value.trim() || '你';
        avatar.textContent = name.charAt(0);
    });

    // ===== 妆容推荐 =====
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const previewWrap = document.getElementById('previewWrap');
    const previewImg = document.getElementById('previewImg');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('errorBox');
    const result = document.getElementById('result');
    const makeupName = document.getElementById('makeupName');
    const faceShape = document.getElementById('faceShape');
    const skinTone = document.getElementById('skinTone');
    const matchScore = document.getElementById('matchScore');
    const shade = document.getElementById('shade');
    const reasonText = document.getElementById('reasonText');

    let selectedFile = null;

    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            showError('请上传图片文件');
            return;
        }
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            previewImg.src = e.target.result;
            previewWrap.classList.add('show');
            analyzeBtn.disabled = false;
            hideError();
            result.classList.remove('show');
        };
        reader.readAsDataURL(file);
    }

    function showError(msg) { errorBox.textContent = '❌ ' + msg; errorBox.classList.add('show'); }
    function hideError() { errorBox.classList.remove('show'); }

    analyzeBtn.addEventListener('click', async () => {
        if (!selectedFile) return;
        analyzeBtn.disabled = true;
        loading.classList.add('show');
        hideError();
        result.classList.remove('show');

        const formData = new FormData();
        formData.append('file', selectedFile);

        try {
            const resp = await fetch('/predict', { method: 'POST', body: formData });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.detail || '服务器错误');
            // 填充结果
            makeupName.textContent = '💄 ' + data.makeup;
            faceShape.textContent = data.face_shape || '—';
            skinTone.textContent = data.skin_tone || '—';
            matchScore.textContent = (data.match || 0) + '%';
            shade.textContent = data.shade || '—';
            reasonText.textContent = data.reason || '';
            result.classList.add('show');
        } catch (err) {
            showError(err.message || '网络错误，请确保服务已启动');
        } finally {
            loading.classList.remove('show');
            analyzeBtn.disabled = false;
        }
    });

    // ===== AI 聊天 =====
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const chatSend = document.getElementById('chatSend');

    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        div.textContent = text;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    chatSend.addEventListener('click', async () => {
        const question = chatInput.value.trim();
        if (!question) return;
        appendMessage('user', question);
        chatInput.value = '';
        chatSend.disabled = true;

        const formData = new FormData();
        formData.append('question', question);

        try {
            const resp = await fetch('/api/chat', { method: 'POST', body: formData });
            const data = await resp.json();
            if (data.code === 200) {
                appendMessage('assistant', data.answer);
            } else {
                appendMessage('assistant', '抱歉，我遇到了一些问题：' + (data.error || '未知错误'));
            }
        } catch (err) {
            appendMessage('assistant', '网络错误，请重试。');
        } finally {
            chatSend.disabled = false;
            chatInput.focus();
        }
    });

    chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') chatSend.click();
    });
</script>
</body>
</html>
